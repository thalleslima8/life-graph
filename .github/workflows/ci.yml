name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore LifeGraph.sln --locked-mode

      - name: Format (GEN-092)
        run: dotnet format LifeGraph.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build LifeGraph.sln --no-restore --configuration Release

      # The build regenerates openapi/lifegraph.json; a diff means the contract
      # changed without being committed (API-001).
      - name: OpenAPI contract is committed
        run: git diff --exit-code -- openapi/

      # Integration tests start pgvector through Testcontainers (DA-007).
      - name: Test
        run: dotnet test --solution LifeGraph.sln --no-build --configuration Release

      - name: Vulnerable packages (GEN-063)
        run: |
          dotnet list LifeGraph.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qiE '\b(high|critical)\b' vulnerable.txt; then
            echo "::error::High or critical vulnerabilities in NuGet packages"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Vulnerable packages (GEN-063)
        run: npm audit --audit-level=high

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
