version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint (<6.1) and openapi-typescript (^5) do not support
      # TypeScript 6+/7 yet. Remove once both widen their peer range.
      - dependency-name: typescript
        versions: [">= 6"]
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Devcontainer base image and the pinned compose images.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /.devcontainer
    schedule:
      interval: weekly
